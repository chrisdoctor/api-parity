[project]
name = "api-parity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chrisdoctor", email = "chris.doctor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
api-parity = "api_parity:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
